name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:extension
      - run: npm run package:extension:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: |
            extension/diagram-dsl-chrome.zip
            extension/diagram-dsl-firefox.zip
