<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagram DSL</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; color: #1f2328; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { color: #59636e; margin: 0 0 13px; }
    button { width: 100%; border: 0; border-radius: 7px; padding: 9px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:disabled { background: #8c959f; cursor: default; }
    #status { min-height: 20px; margin-top: 10px; font-size: 12px; }
    .privacy { margin-top: 12px; padding-top: 10px; border-top: 1px solid #d8dee4; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Diagram DSL</h1>
  <p id="site">GitHubまたはNotionで開いてください。</p>
  <button id="toggle" type="button" disabled>確認中…</button>
  <div id="status" role="status" aria-live="polite"></div>
  <p class="privacy">変換と描画はこのブラウザ内で行います。ページ内容は送信しません。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
